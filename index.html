.bg::after {
 content: '';
 position: absolute; inset: 0;
 background:
 radial-gradient(ellipse 100% 50% at 50% 0%, rgba(240,235,225,0.35) 0%, transparent 60%),
 radial-gradient(ellipse 80% 60% at 50% 100%, rgba(30,28,25,0.6) 0%, transparent 65%),
 linear-gradient(180deg, rgba(240,235,225,0.1) 0%, rgba(20,18,15,0.15) 60%, rgba(20,18,15,0.45) 100%);
}
.orbs { position:fixed; inset:0; z-index:1; pointer-events:none; }
.orb {
 position:absolute; border-radius:50%;
 background: radial-gradient(circle, rgba(200,210,190,0.08) 0%, transparent 70%);
 animation: drift ease-in-out infinite;
}
@keyframes drift {
 0%,100% { transform: translateY(0) scale(1); }
 50% { transform: translateY(-20px) scale(1.05); }
}
.content {
 position: relative; z-index:10;
 display: flex; flex-direction: column; align-items: center; justify-content: center;
 min-height: 100dvh;
 padding: max(2.5rem, env(safe-area-inset-top)) 1.5rem max(2.5rem, env(safe-area-inset-bottom));
}
.av-wrap { position:relative; width:108px; height:108px; margin-bottom:1.2rem; }
.av-ring {
 position:absolute; inset:-2px; border-radius:50%;
 background: conic-gradient(#ff1493, #ff69b4, #ff00a0, #ff69b4, #ff1493);
 box-shadow: 0 0 18px rgba(255,20,147,0.8), 0 0 36px rgba(255,20,147,0.45);
 animation: spin 12s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.av-inner {
 position:absolute; inset:2px; border-radius:50%;
 background: var(--dark); z-index:1;
}
.av-img {
 position:absolute; inset:4px; z-index:2;
 width:calc(100% - 8px); height:calc(100% - 8px);
 border-radius:50%; object-fit:cover; display:block;
}
h1 {
 font-family: 'Lora', serif;
 font-size: 3.4rem;
 font-weight: 400;
 font-style: italic;
 color: var(--cream);
 letter-spacing: 0.04em;
 text-align: center;
 margin-bottom: 0.4rem;
 text-shadow: 0 2px 20px rgba(0,0,0,0.3);
}
.tagline {
 font-family: 'Raleway', sans-serif;
 font-weight: 300;
 font-size: 0.65rem;
 letter-spacing: 0.35em;
 text-transform: uppercase;
 color: rgba(220,215,205,0.6);
 margin-bottom: 1rem;
 text-align: center;
}
.line {
 width: 40px; height: 1px;
 background: linear-gradient(90deg, transparent, rgba(200,195,185,0.5), transparent);
 margin: 0 auto 1rem;
}
.loc {
 display:inline-flex; align-items:center; gap:6px;
 font-family:'Raleway', sans-serif; font-weight:300;
 font-size:0.65rem; letter-spacing:0.2em; text-transform:uppercase;
 color: rgba(210,205,195,0.7);
 margin-bottom: 1.8rem;
}
.loc-dot {
 width:4px; height:4px; border-radius:50%;
 background: #a08060;
 box-shadow: 0 0 6px rgba(160,128,96,0.8);
 animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.3;} }
.btns {
 display:flex; flex-direction:column; gap:0.55rem;
 width:100%; max-width:280px;
}
.btn {
 position:relative; overflow:hidden;
 display:flex; align-items:center; justify-content:center;
 width:100%; min-height:52px; padding:0 1.8rem;
 border-radius:999px;
 background: rgba(255,255,255,0.03);
 backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
 border: 1px solid rgba(200,195,185,0.12);
 color: rgba(235,230,220,0.9);
 font-family:'Raleway', sans-serif;
 font-size:0.7rem; font-weight:400;
 letter-spacing:0.22em; text-transform:uppercase;
 text-decoration:none; text-align:center;
 cursor:pointer; touch-action:manipulation;
 user-select:none; -webkit-user-select:none;
 transition: background 0.3s, transform 0.15s;
}
.btn::before {
 content:''; position:absolute; inset:0; border-radius:999px;
 background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
 pointer-events:none;
}
.btn-primary {
 background: rgba(160,128,96,0.1);
 border-color: rgba(180,145,105,0.3);
 color: rgba(240,238,232,0.95);
 font-weight: 500;
 letter-spacing: 0.25em;
 box-shadow:
 0 0 30px rgba(160,128,96,0.15),
 0 8px 24px rgba(0,0,0,0.25),
 inset 0 1px 0 rgba(210,190,160,0.2);
}
.btn:active { transform: scale(0.98); }
.btn-primary {
 font-size: 0.95rem !important;
 min-height: 58px;
 animation: shake 3s ease-in-out infinite;
}
@keyframes shake {
 0%, 80%, 100% { transform: translateX(0) rotate(0); }
 82% { transform: translateX(-3px) rotate(-1.5deg); }
 84% { transform: translateX(3px) rotate(1.5deg); }
 86% { transform: translateX(-3px) rotate(-1.5deg); }
 88% { transform: translateX(3px) rotate(1.5deg); }
 90% { transform: translateX(-2px) rotate(-1deg); }
 92% { transform: translateX(2px) rotate(1deg); }
 94% { transform: translateX(0) rotate(0); }
}

@media (hover:hover) {
 .btn:hover { background: rgba(255,255,255,0.1); }
 .btn-primary:hover { background: rgba(138,158,138,0.25); }
}
.footer {
 margin-top:2rem;
 font-family:'DM Serif Display', serif;

@media (max-width:430px) {

@media (max-height:650px) {

}
